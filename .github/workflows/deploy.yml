name: Deploy to VPS

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # VPS_USER is not root. It needs passwordless sudo for exactly:
            #   /usr/bin/mkdir, /usr/bin/tee, /usr/bin/docker
            # `sudo -n` fails fast instead of waiting for a password.

            # The directory may be root-only (e.g. /root/apps), so use absolute paths instead of cd
            APP_DIR='${{ secrets.TARGET_DIRECTORY }}'
            COMPOSE_FILE="$APP_DIR/docker-compose.prod.yml"
            ENV_FILE="$APP_DIR/.env.deploy"
            sudo -n mkdir -p "$APP_DIR"

            # Login to GHCR on VPS (Requires a PAT with 'read:packages' scope)
            printf '%s' "${{ secrets.GH_PAT }}" | sudo -n docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create or update docker-compose.prod.yml
            sudo -n tee "$COMPOSE_FILE" > /dev/null <<'EOF'
            services:
              app:
                image: ghcr.io/adminvpshub/ais-terminal:latest
                ports:
                  - "3000:3001"
                environment:
                  - NODE_ENV=production
                  - PORT=3001
                  - GEMINI_API_KEY=${GEMINI_API_KEY}
                  - ADMIN_TOKEN=${ADMIN_TOKEN}
                  - MAX_PROMPTS_PER_SESSION_PER_DAY=${MAX_PROMPTS_PER_SESSION_PER_DAY}
                  - INTERNAL_SSH_ROUTES=${INTERNAL_SSH_ROUTES}
                restart: always
            EOF

            # Values for the compose file. sudo strips the caller's environment, so pass
            # them through --env-file; umask 077 keeps the file (it holds secrets) root-only.
            umask 077
            sudo -n tee "$ENV_FILE" > /dev/null <<'EOF'
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
            MAX_PROMPTS_PER_SESSION_PER_DAY=${{ secrets.MAX_PROMPTS_PER_SESSION_PER_DAY || secrets.MAX_PROMTS_PER_SESSION_PER_DAY }}
            INTERNAL_SSH_ROUTES=${{ vars.INTERNAL_SSH_ROUTES }}
            EOF

            # Pull and restart
            sudo -n docker compose --project-directory "$APP_DIR" --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull
            sudo -n docker compose --project-directory "$APP_DIR" --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d
